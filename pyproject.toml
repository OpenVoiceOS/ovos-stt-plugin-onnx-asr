[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-stt-plugin-onnx-asr"
dynamic = ["version"]
description = "A onnx stt plugin for OVOS"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "JarbasAi", email = "jarbasai@mailfence.com"}
]
keywords = ["ovos", "plugin", "stt"]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "ovos-plugin-manager>=2.1.1,<3.0.0",
    # [cpu] brings onnxruntime and [hub] brings huggingface-hub. onnx-asr keeps
    # both behind extras, and this plugin needs both: _wav2vec2.py imports
    # onnxruntime directly, and model ids resolve from Hugging Face. A GPU
    # install replaces onnxruntime with onnxruntime-gpu, which does not
    # co-install with it, so gpu is not declared here.
    "onnx_asr[cpu,hub]>=0.11.0",
    "ovos-spec-tools>=1.6.0a2,<2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-randomly",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-stt-plugin-onnx-asr"

[project.entry-points."opm.stt"]
"ovos-stt-plugin-onnx-asr" = "ovos_stt_plugin_onnxasr:OnnxASR"

[tool.setuptools.dynamic]
version = {attr = "ovos_stt_plugin_onnxasr.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_stt_plugin_onnxasr*"]
