name: Run Unit Tests
on:
  pull_request:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install . pytest pytest-randomly onnxruntime
      - name: Run unit tests
        # The suite stubs onnx_asr in sys.modules; randomized order is kept on
        # purpose so a test that fails to restore what it replaced is caught
        # here rather than surfacing as an unrelated failure later.
        run: |
          pytest test/ -v
